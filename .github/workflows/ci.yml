name: Surakshit Vault CI & Security Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies (High/Critical)
        run: npm audit --audit-level=high || true

      - name: Frontend Typecheck
        run: npx tsc --noEmit

      - name: Worker Typecheck
        run: npx tsc --project tsconfig.worker.json --noEmit

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Production Build Verification
        run: npm run build
