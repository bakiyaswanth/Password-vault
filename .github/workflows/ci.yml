name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Frontend & Tests
        run: npx tsc --noEmit

      - name: Typecheck Cloudflare Worker
        run: npx tsc --project tsconfig.worker.json --noEmit

      - name: Run Cryptographic & Integration Test Suite
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build
