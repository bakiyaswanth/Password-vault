name: Surakshit Vault CI/CD & Cloudflare Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Typechecks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite (Unit, Crypto, Importer, & Worker tests)
        run: npm test

      - name: Typecheck Frontend & Worker
        run: |
          npx tsc --noEmit
          npx tsc --project tsconfig.worker.json --noEmit

      - name: Build Frontend Production Bundle
        run: npm run build

  deploy:
    name: Deploy to Cloudflare (Pages + Worker + D1)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Ensure Cloudflare Pages Project Exists
        run: |
          npx wrangler pages project create surakshit-vault --production-branch=main --config /dev/null || echo "Pages project already exists"

      - name: Deploy Frontend to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist --project-name=surakshit-vault --commit-dirty=true --config /dev/null

      - name: Apply Cloudflare D1 Migrations
        run: |
          npx wrangler d1 execute surakshit-vault-db --remote --file=./migrations/0001_initial_schema.sql

      - name: Deploy Cloudflare Worker API
        run: |
          npx wrangler deploy
