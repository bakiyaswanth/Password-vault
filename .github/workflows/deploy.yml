name: Surakshit Vault CI/CD & Cloudflare Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Typechecks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite (Unit, Crypto, Importer, & Worker tests)
        run: npm test

      - name: Typecheck Frontend & Worker
        run: |
          npx tsc --noEmit
          npx tsc --project tsconfig.worker.json --noEmit

      - name: Build Frontend Production Bundle
        run: npm run build

  deploy:
    name: Deploy to Cloudflare Pages & D1
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure D1 Database UUID in wrangler.toml
        run: |
          if [ -n "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "Injecting Cloudflare D1 Database UUID into wrangler.toml..."
            sed -i "s/D1_DATABASE_ID_PLACEHOLDER/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.toml
          fi

          if grep -q "D1_DATABASE_ID_PLACEHOLDER" wrangler.toml; then
            echo "::error ::D1 Database UUID is missing! Please paste your real D1 UUID into wrangler.toml (database_id = \"your-uuid\") OR add CLOUDFLARE_D1_DATABASE_ID to GitHub Repository Secrets."
            exit 1
          fi

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist --project-name=surakshit-vault --commit-dirty=true

      - name: Apply Cloudflare D1 Remote Database Migrations
        run: |
          npx wrangler d1 execute surakshit-vault-db --remote --file=./migrations/0001_initial_schema.sql
