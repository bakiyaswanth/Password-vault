name: Surakshit Vault CI/CD & Cloudflare Pages Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Frontend & Worker
        run: npm run typecheck

      - name: Run Vitest Security & Unit Suite
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Validate Production Build Output
        run: |
          test -f dist/index.html || (echo "ERROR: dist/index.html missing!" && exit 1)
          test -f dist/favicon.ico || (echo "ERROR: dist/favicon.ico missing!" && exit 1)
          test -f dist/_headers || (echo "ERROR: dist/_headers missing!" && exit 1)
          test -f dist/_redirects || (echo "ERROR: dist/_redirects missing!" && exit 1)
          test -f dist/_routes.json || (echo "ERROR: dist/_routes.json missing!" && exit 1)
          grep -rn "file://" dist/ && (echo "ERROR: file:// URL leaked into production build!" && exit 1) || true
          echo "Build Output Validation Passed Successfully."

      - name: Deploy to Cloudflare Pages (Main Branch Only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=surakshit-vault

      - name: Post-Deployment Production Smoke Test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Running production HTTP smoke tests..."
          curl -sfI https://surakshit-vault.pages.dev/ || (echo "FAILED: Root / 404" && exit 1)
          curl -sfI https://surakshit-vault.pages.dev/favicon.ico || (echo "FAILED: Favicon 404" && exit 1)
          curl -sf https://surakshit-vault.pages.dev/api/health | grep '"status":"ok"' || (echo "FAILED: API Health" && exit 1)
          echo "All production smoke tests passed."
